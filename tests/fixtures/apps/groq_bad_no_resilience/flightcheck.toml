# Runtime test settings for this fixture (plan §17.2; Groq run, ADR-038). No [project] table:
# detection classifies the app as groq. The app reads its OpenAI-SDK base URL from
# GROQ_OPENAI_BASE_URL, which FlightCheck points at <mock>/openai/v1; GROQ_API_KEY gets the fake
# key and the scenarios are S01–S06 plus S11 (Groq defaults). "python" must be on PATH;
# FlightCheck runs exactly this command, never through a shell.
[test]
command = ["python", "main.py", "What is the weather in Delhi?"]
timeout_s = 20
base_url_env = ["GROQ_OPENAI_BASE_URL"]
